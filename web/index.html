<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PvP 对战模拟器 · 打一场 3v3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 页面只负责填表和显示；建配置、检查、对战都在 Python 引擎里（pogo_sim/web_api.py）。 -->
  <header>
    <nav class="pages"><a class="current" href="index.html">打一场 3v3</a><a href="stats.html">能力值排序</a></nav>
    <h1>PvP 对战模拟器 · 打一场 3v3</h1>
    <p class="muted">双方都用 3v3 策略 TeamPolicy（docs/mechanics.md 13.7）。不填 IV 和等级时按赛季规则取 IV 排名第 1 和合法的最高等级。</p>
  </header>

  <main>
    <section class="card" id="settings">
      <h2>设置</h2>
      <div class="row">
        <label>联盟 <select id="league"></select></label>
        <label>赛季规则 <select id="season"></select></label>
      </div>
      <div id="custom-files"></div>
    </section>

    <section class="teams" id="teams"></section>

    <section class="actions">
      <button class="primary" id="run">打一场</button>
      <button id="reset">恢复例子队伍</button>
      <span class="manual-start">
        <label>手动对战：我操作 <select id="manual-side"></select></label>
        <button id="manual-start">开始手动对战</button>
        <button id="manual-resume" hidden>继续上次的手动对战</button>
      </span>
      <span class="muted" id="status"></span>
    </section>

    <div class="error" id="error" hidden></div>

    <section id="arena" hidden></section>

    <section id="result" hidden></section>
  </main>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>

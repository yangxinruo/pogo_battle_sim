# 自定义数据：Mega 基格尔德（未发布）
#
# 加载：gm = load_gamemaster(custom_files=["data/custom/mega_zygarde.toml"])
# 格式说明见 data/custom/mega_froslass.toml 开头和 docs/mechanics.md 第 10 节。

[meta]
description = "Mega 基格尔德。正作能力值来自 Legends Z-A；专属招式 Nihil Light 在 GO 里的数值是假设的。"
sources = [
    "https://pokemondb.net/pokedex/zygarde",
    "https://bulbapedia.bulbagarden.net/wiki/Nihil_Light_(move)",
    "https://www.smogon.com/forums/threads/legends-z-a-mechanics-research.3772579",
]


[new_pokemon.zygarde_mega]
speciesName = "Zygarde (Mega)"
dex = 718
types = ["dragon", "ground"]

# 正作六项种族值（Legends Z-A：216 / 70 / 91 / 216 / 85 / 100，总和 778）。
# 40 级满 IV CP 超过 Mega 削弱门槛 6000，按 0.97 削弱（和 Mega 超梦X/Y 同一条规则）。
# 对照：完全体基格尔德正作 HP 也是 216，GO 里是 389 = floor(428 × 0.91)，用的是非 Mega 的 0.91 削弱。
mainSeriesStats = { hp = 216, attack = 70, defense = 91, spAttack = 216, spDefense = 85, speed = 100 }

# 招式池照抄完全体基格尔德（gamemaster 的 zygarde_complete）。
fastMoves = ["DRAGON_TAIL", "BITE", "ZEN_HEADBUTT"]
chargedMoves = ["OUTRAGE", "EARTHQUAKE", "CRUNCH", "HYPER_BEAM", "BULLDOZE"]
extraChargedMoves = ["NIHIL_LIGHT"]  # 第三个大招只能从这里选

# legendary、untradeable 照抄完全体基格尔德；supermega：默认 Mega 等级 4（照 PvPoke）。
tags = ["legendary", "untradeable", "mega", "supermega"]
released = false


# Mega 基格尔德的专属招式（正作里是龙属性特殊招式，Core Enforcer 在 Mega 进化后变成它）。
# 正作数据：Smogon 拆包是 100 威力；Serebii 记的 Legends Z-A 实战数值是 200 威力、15 秒冷却。
# 正作效果"能打到妖精、无视目标的能力变化"没有实现（见 docs/mechanics.md 第 7 节）。
#
# GO 里的数值是假设的，套用现有传说 Mega 专属招式的模板：
# Mega 超梦X 的 Dynamic Punch+、Mega 超梦Y 的 Future Sight+ 都是 130 威力 / 80 能量。
# 伤害另外按 Mega 等级乘 1–1.3 倍（isMegaMove，引擎自动乘），这里的 power 不含这个倍率。
[new_moves.NIHIL_LIGHT]
name = "Nihil Light"
type = "dragon"
power = 130
energy = 80
energyGain = 0
turns = 1
isMegaMove = true
